name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Compilar
        run: ./gradlew assembleDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MicrofonoAltavoz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MicrofonoAltavoz
          path: MicrofonoAltavoz.apk
      - name: Publicar versión descargable
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Micrófono altavoz (build ${{ github.run_number }})
          files: MicrofonoAltavoz.apk
